[project]
name = "l9format"
version = "2.0.1"
license = {text = "MIT"}
description = "l9format is a schema declaration targeted at interoperability between network recon tools used at LeakIX"
authors = [{name = "Danny Willems", email = "danny@leakix.net"}]
maintainers = [{name = "Danny Willems", email = "danny@leakix.net"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/leakix/l9format-python"
Repository = "https://github.com/leakix/l9format-python"
Documentation = "https://github.com/leakix/l9format-python"
"Bug Tracker" = "https://github.com/leakix/l9format-python/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.161.6",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "cyclonedx-bom>=7.3.1",
    "nox>=2026.7.11",
    "zizmor>=1.28.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["l9format/", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["l9format/"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM",
    "S", "ASYNC", "PT", "PTH", "PIE", "RET", "ARG", "ERA", "RUF",
    "PLC", "PLE", "PLW",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002", "PLW", "PTH123", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["l9format"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
